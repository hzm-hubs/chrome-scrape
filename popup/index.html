<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="version" content="1.0.0" />
		<link href="./index.css" rel="stylesheet" />
	</head>
	<body>
	<h1 id="pageTitle">字段读取</h1>
		<div class="controls" style="display: flex; flex-direction: column;">
			<div class="appInfo">
				<Input id="appId"  placeholder="请填写 appId">
				<Input id="appSecretId"  placeholder="请填写 appSecretId">
				<Input id="tableUrlId" placeholder="请填写 多维表视图链接">
			</div>
		  <div class="tips" id="fieldScrape_tip">欢迎~~</div>
		  <div class="buttons">
			<button id="start" class="btn">开始读取</button>
			<button id="exportCsv" class="btn" style="background-color: #ff9800;">导出CSV</button>
			<button id="exportFeiSu" class="btn" style="background-color: #4CAF50;">上传到飞书</button>
			<button id="settingsBtn" class="btn" style="background-color: #6b7075;">设置</button>
		  </div>
		</div>
		
		<!-- 设置面板 -->
		<div id="settingsPanel" style="display: none; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; background-color: #f9f9f9;">
		  <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 16px;">飞书多维表格设置</h3>
		  <div style="margin-bottom: 10px;">
			<label for="feishuBaseUrl" style="display: block; margin-bottom: 5px;">多维表格URL:</label>
			<input type="text" id="feishuBaseUrl" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px;" placeholder="例如: https://mideqnf1p7d.feishu.cn/base/TAAsbKNniaMaodss84tcEQSun3f?table=tbllpvh8BykaNQBM&view=vewvd05oOX">
		  </div>
		  <div style="display: flex; justify-content: flex-end;">
			<button id="saveSettingsBtn" class="btn" style="background-color: #2196F3;">保存设置</button>
		  </div>

		  <div id="result">加载中...</div>
	</body>
	<script src="index.js"></script>
</html>
