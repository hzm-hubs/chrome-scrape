<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="version" content="1.0.0" />
    <link href="./index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="pageTitle" class="page-title">字段读取</div>
    <div class="page-area">
      <div id="contentTip" class="page-tips"></div>
      <div id="buttonArea" class="buttons">
        <button id="start" class="btn">开始读取</button>
        <button id="exportCsv" class="btn" style="background-color: #ff9800">
          导出CSV
        </button>
        <button id="exportFeiSu" class="btn" style="background-color: #4caf50">
          上传飞书
        </button>
        <button id="settings" class="btn" style="background-color: #6b7075">
          打开设置
        </button>
      </div>

      <!-- 设置面板 -->
      <div id="settingsPanel" class="setting-area hide-element">
        <div>
          <div class="setting-label">授权码</div>
          <input id="cozeToken" placeholder="" />
        </div>
        <div>
          <div class="setting-label">应用标识</div>
          <input id="appId" placeholder="" />
        </div>
        <div>
          <div class="setting-label">文档链接</div>
          <input id="documentLink" placeholder="" />
        </div>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
